name: Preprint source and document checks
on:
  push:
    branches: [main, preprint-readiness-20261121]
    paths:
      - 'MANUSCRIPT.md'
      - 'README.md'
      - 'build_pdf.py'
      - 'requirements.txt'
      - 'reconciliation_protocol.md'
      - 'HUMAN_STUDY_PROTOCOL.md'
      - 'REPRODUCIBILITY.md'
      - 'judge/out/robust_analysis.json'
      - 'scripts/**'
      - '.github/workflows/preprint_checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_preprint_consistency.py
      - run: (cd judge && python test_robust_analysis.py && python test_export_disagreement.py)
      - run: (cd dataset/physician && python test_physician_study.py)
  build-pdf:
    needs: offline-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Markdown>=3.5'
      - uses: browser-actions/setup-chrome@v1
      - name: Render and validate PDF
        run: |
          python build_pdf.py
          test -s MANUSCRIPT.pdf
          pdftotext MANUSCRIPT.pdf - | grep -qi 'evaluation instrument'
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-manuscript-review
          path: MANUSCRIPT.pdf
      - name: Commit source-synchronized PDF on review branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprint-readiness-20261121'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANUSCRIPT.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate manuscript PDF from canonical Markdown source"
            git push origin HEAD:${{ github.ref_name }}
          fi
